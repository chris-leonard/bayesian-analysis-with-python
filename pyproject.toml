[project]
name = "bayesian-analysis-with-python"
version = "0.1.0"
description = "Notes and exercise solutions for 'Bayesian Analysis with Python' (3rd ed.) by Osvaldo A. Martin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arviz>=1.2.0",
    "bambi>=0.19.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "nutpie>=0.16.11",
    "pandas>=3.0.5",
    "preliz>=0.27.1",
    "pymc>=6.2.0",
    "pymc-bart>=0.12.0",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "nbconvert>=7.17.1",
]
